{% if not request.user.is_authenticated or not request.user.is_staff %}
<script>
(function () {
    if (window.__liederTrafficBeaconSent) {
        return;
    }

    window.__liederTrafficBeaconSent = true;


    // -------------------------------------------------
    // Základní stav dokumentu
    // -------------------------------------------------

    var pageStartedAt = performance.now();

    var browserSent = false;
    var engagedSent = false;
    var meaningfulInteractionSent = false;
    var diagnosticSent = false;

    var browserTimer = null;
    var engagedTimer = null;


    // -------------------------------------------------
    // Diagnostika interakcí
    // -------------------------------------------------

    var hadPointer = false;
    var hadTouch = false;
    var hadScroll = false;
    var hadKey = false;

    var firstPointerMs = null;
    var firstTouchMs = null;
    var firstScrollMs = null;
    var firstMeaningfulMs = null;

    var meaningfulInteractionType = "";

    // Poslední skutečný touch/pointer input.
    // Použijeme ho pro rozlišení skutečného user scrollu
    // od technického obnovení scroll pozice browserem.
    var lastTrustedPointerOrTouchAt = null;

    var maxScrollPct = 0;


    // -------------------------------------------------
    // Diagnostika viditelnosti
    // -------------------------------------------------

    var visibleStartedAt = null;
    var totalVisibleMs = 0;
    var maxVisibleSpanMs = 0;

    var visibilityChanges = 0;
    var visibleIntervals = 0;

    var wasPrerendered = false;


    // -------------------------------------------------
    // Pomocné funkce
    // -------------------------------------------------

    function elapsedFromStart() {
        return Math.max(
            0,
            Math.round(
                performance.now() - pageStartedAt
            )
        );
    }


    function createDocumentId() {
        try {
            if (
                window.crypto &&
                typeof window.crypto.randomUUID === "function"
            ) {
                return window.crypto.randomUUID();
            }
        } catch (error) {}

        return (
            Date.now().toString(36) +
            "-" +
            Math.random().toString(36).slice(2) +
            "-" +
            Math.round(performance.now()).toString(36)
        );
    }


    function hasDocumentFocus() {
        try {
            return (
                typeof document.hasFocus === "function" &&
                document.hasFocus()
            );
        } catch (error) {
            return false;
        }
    }


    function getNavigationType() {
        try {
            if (
                performance &&
                typeof performance.getEntriesByType === "function"
            ) {
                var entries = performance.getEntriesByType(
                    "navigation"
                );

                if (
                    entries &&
                    entries.length &&
                    entries[0].type
                ) {
                    return String(entries[0].type);
                }
            }
        } catch (error) {}

        return "unknown";
    }


    function isPrerendering() {
        return (
            "prerendering" in document &&
            document.prerendering
        );
    }


    function isActuallyVisible() {
        return (
            document.visibilityState === "visible" &&
            !isPrerendering()
        );
    }


    function getReferrerHost() {
        if (!document.referrer) {
            return "";
        }

        try {
            return (
                new URL(document.referrer)
                .hostname
                .toLowerCase()
            );
        } catch (error) {
            return "";
        }
    }


    function isMetaHost(host) {
        if (!host) {
            return false;
        }

        return (
            host === "instagram.com" ||
            host.endsWith(".instagram.com") ||
            host === "facebook.com" ||
            host.endsWith(".facebook.com") ||
            host === "fb.com" ||
            host.endsWith(".fb.com")
        );
    }


    function isMetaLikeVisit() {
        var ua = (
            navigator.userAgent || ""
        ).toLowerCase();

        if (
            ua.indexOf("instagram") !== -1 ||
            ua.indexOf("fb_iab/") !== -1 ||
            ua.indexOf("fban/") !== -1 ||
            ua.indexOf("fbav/") !== -1
        ) {
            return true;
        }

        return isMetaHost(
            getReferrerHost()
        );
    }


    // -------------------------------------------------
    // Identita konkrétního JS dokumentu
    // -------------------------------------------------

    var trafficDocumentId = createDocumentId();

    var initialVisibility = (
        document.visibilityState || "unknown"
    );

    var initialFocus = hasDocumentFocus();

    var navigationType = getNavigationType();

    // Hodnoty při vytvoření konkrétní instance dokumentu.
    var initialDocumentUserAgent = (
        navigator.userAgent || ""
    );

    var initialDocumentReferrer = (
        document.referrer || ""
    );


    if (isPrerendering()) {
        wasPrerendered = true;
    }


    // -------------------------------------------------
    // Beacon POST
    // -------------------------------------------------

    function postBeacon(
        stage,
        trigger,
        extraData
    ) {
        var params = new URLSearchParams();

        params.append(
            "path",
            window.location.pathname
        );

        params.append(
            "stage",
            stage
        );

        params.append(
            "document_id",
            trafficDocumentId
        );

        params.append(
            "initial_visibility",
            initialVisibility
        );

        params.append(
            "initial_focus",
            initialFocus ? "1" : "0"
        );

        params.append(
            "navigation_type",
            navigationType
        );

        params.append(
            "document_ua",
            initialDocumentUserAgent
        );

        params.append(
            "document_referrer",
            initialDocumentReferrer
        );

        if (trigger) {
            params.append(
                "trigger",
                trigger
            );
        }

        if (extraData) {
            Object.keys(
                extraData
            ).forEach(function (key) {
                params.append(
                    key,
                    String(extraData[key])
                );
            });
        }

        var body = params.toString();

        if (navigator.sendBeacon) {
            var blob = new Blob(
                [body],
                {
                    type:
                        "application/x-www-form-urlencoded;" +
                        "charset=UTF-8"
                }
            );

            var queued = navigator.sendBeacon(
                "/traffic/engaged/",
                blob
            );

            if (queued) {
                return;
            }
        }

        fetch(
            "/traffic/engaged/",
            {
                method: "POST",
                body: body,
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded;" +
                        "charset=UTF-8"
                },
                credentials: "same-origin",
                keepalive: true
            }
        ).catch(function () {});
    }


    // -------------------------------------------------
    // Slabý Browser signal >= 750 ms
    // -------------------------------------------------

    function sendBrowserConfirmation() {
        if (
            browserSent ||
            !isActuallyVisible()
        ) {
            return;
        }

        browserSent = true;

        postBeacon(
            "browser",
            "timer"
        );
    }


    // -------------------------------------------------
    // Silný Engaged signal >= 3000 ms
    // -------------------------------------------------

    function sendEngagedConfirmation() {
        if (
            engagedSent ||
            !isActuallyVisible()
        ) {
            return;
        }

        engagedSent = true;

        postBeacon(
            "engaged",
            "timer"
        );
    }


    // -------------------------------------------------
    // Silná smysluplná interakce
    // -------------------------------------------------

    function sendMeaningfulInteraction(type) {
        if (
            meaningfulInteractionSent ||
            !isActuallyVisible()
        ) {
            return;
        }

        meaningfulInteractionSent = true;
        meaningfulInteractionType = type;
        firstMeaningfulMs = elapsedFromStart();

        postBeacon(
            "interaction",
            type,
            {
                interaction_type: type,
                interaction_ms: firstMeaningfulMs
            }
        );
    }


    // -------------------------------------------------
    // Visible interval
    // -------------------------------------------------

    function startVisibleSpan() {
        if (
            !isActuallyVisible() ||
            visibleStartedAt !== null
        ) {
            return;
        }

        visibleStartedAt = performance.now();
        visibleIntervals += 1;
    }


    function endVisibleSpan() {
        if (visibleStartedAt === null) {
            return;
        }

        var now = performance.now();

        var spanMs = Math.max(
            0,
            now - visibleStartedAt
        );

        totalVisibleMs += spanMs;

        maxVisibleSpanMs = Math.max(
            maxVisibleSpanMs,
            spanMs
        );

        visibleStartedAt = null;
    }


    function clearTimers() {
        if (browserTimer !== null) {
            clearTimeout(browserTimer);
            browserTimer = null;
        }

        if (engagedTimer !== null) {
            clearTimeout(engagedTimer);
            engagedTimer = null;
        }
    }


    function scheduleVisibleTimers() {
        if (!isActuallyVisible()) {
            return;
        }

        startVisibleSpan();

        if (
            !browserSent &&
            browserTimer === null
        ) {
            browserTimer = setTimeout(
                function () {
                    browserTimer = null;
                    sendBrowserConfirmation();
                },
                750
            );
        }

        if (
            !engagedSent &&
            engagedTimer === null
        ) {
            engagedTimer = setTimeout(
                function () {
                    engagedTimer = null;
                    sendEngagedConfirmation();
                },
                3000
            );
        }
    }


    // -------------------------------------------------
    // Pointer / touch
    //
    // Samotný pointerdown/touchstart NENÍ strong human
    // signal. Pouze ho diagnosticky zaznamenáme.
    // -------------------------------------------------

    document.addEventListener(
        "pointerdown",
        function (event) {
            if (
                event &&
                event.isTrusted === false
            ) {
                return;
            }

            hadPointer = true;
            lastTrustedPointerOrTouchAt = performance.now();

            if (firstPointerMs === null) {
                firstPointerMs = elapsedFromStart();
            }
        },
        {
            passive: true,
            capture: true
        }
    );


    document.addEventListener(
        "touchstart",
        function (event) {
            if (
                event &&
                event.isTrusted === false
            ) {
                return;
            }

            hadTouch = true;
            lastTrustedPointerOrTouchAt = performance.now();

            if (firstTouchMs === null) {
                firstTouchMs = elapsedFromStart();
            }
        },
        {
            passive: true,
            capture: true
        }
    );


    // -------------------------------------------------
    // Kliknutí na skutečně interaktivní prvek
    // = silný human signal.
    // -------------------------------------------------

    document.addEventListener(
        "click",
        function (event) {
            if (
                !event ||
                event.isTrusted === false ||
                !isActuallyVisible()
            ) {
                return;
            }

            var target = event.target;

            if (
                !target ||
                typeof target.closest !== "function"
            ) {
                return;
            }

            var interactiveElement = target.closest(
                "a, button, input, select, textarea, " +
                "summary, [role='button']"
            );

            if (!interactiveElement) {
                return;
            }

            sendMeaningfulInteraction(
                "click"
            );
        },
        true
    );


    // -------------------------------------------------
    // Klávesnice
    // = silný human signal.
    // -------------------------------------------------

    document.addEventListener(
        "keydown",
        function (event) {
            if (
                !event ||
                event.isTrusted === false
            ) {
                return;
            }

            hadKey = true;

            sendMeaningfulInteraction(
                "keydown"
            );
        },
        true
    );


    // -------------------------------------------------
    // Mouse wheel
    // = skutečný uživatelský input.
    // -------------------------------------------------

    window.addEventListener(
        "wheel",
        function (event) {
            if (
                !event ||
                event.isTrusted === false
            ) {
                return;
            }

            sendMeaningfulInteraction(
                "wheel"
            );
        },
        {
            passive: true,
            capture: true
        }
    );


    // -------------------------------------------------
    // Scroll diagnostika
    //
    // Samotný scroll event nestačí:
    // browser může technicky obnovit scroll pozici.
    //
    // Pokud mu ale těsně předcházel trusted touch/pointer,
    // považujeme jej za user scroll.
    // -------------------------------------------------

    function updateScrollDiagnostic() {
        hadScroll = true;

        if (firstScrollMs === null) {
            firstScrollMs = elapsedFromStart();
        }

        var documentElement = (
            document.documentElement
        );

        var body = document.body;

        var scrollTop = Math.max(
            window.scrollY || 0,
            documentElement
                ? documentElement.scrollTop || 0
                : 0,
            body
                ? body.scrollTop || 0
                : 0
        );

        var documentHeight = Math.max(
            documentElement
                ? documentElement.scrollHeight || 0
                : 0,
            body
                ? body.scrollHeight || 0
                : 0
        );

        var scrollableHeight = Math.max(
            documentHeight -
                window.innerHeight,
            0
        );

        if (scrollableHeight > 0) {
            var pct = Math.round(
                (
                    scrollTop /
                    scrollableHeight
                ) * 100
            );

            pct = Math.max(
                0,
                Math.min(100, pct)
            );

            maxScrollPct = Math.max(
                maxScrollPct,
                pct
            );
        }

        if (
            lastTrustedPointerOrTouchAt !== null &&
            (
                performance.now() -
                lastTrustedPointerOrTouchAt
            ) <= 2000
        ) {
            sendMeaningfulInteraction(
                "scroll"
            );
        }
    }


    window.addEventListener(
        "scroll",
        updateScrollDiagnostic,
        {
            passive: true
        }
    );


    // -------------------------------------------------
    // Meta diagnostika při odchodu
    // -------------------------------------------------

    function sendMetaExitDiagnostic(
        pagehidePersisted
    ) {
        if (
            diagnosticSent ||
            !isMetaLikeVisit()
        ) {
            return;
        }

        diagnosticSent = true;

        // Uzavřeme případný právě běžící visible interval.
        endVisibleSpan();

        var elapsedMs = Math.max(
            0,
            performance.now() -
                pageStartedAt
        );

        postBeacon(
            "diagnostic",
            "pagehide",
            {
                elapsed_ms:
                    Math.round(elapsedMs),

                total_visible_ms:
                    Math.round(totalVisibleMs),

                max_visible_span_ms:
                    Math.round(maxVisibleSpanMs),

                visibility_changes:
                    visibilityChanges,

                visible_intervals:
                    visibleIntervals,

                browser_sent:
                    browserSent ? 1 : 0,

                engaged_sent:
                    engagedSent ? 1 : 0,

                meaningful_sent:
                    meaningfulInteractionSent ? 1 : 0,

                meaningful_type:
                    meaningfulInteractionType || "none",

                had_pointer:
                    hadPointer ? 1 : 0,

                had_touch:
                    hadTouch ? 1 : 0,

                had_scroll:
                    hadScroll ? 1 : 0,

                had_key:
                    hadKey ? 1 : 0,

                first_pointer_ms:
                    firstPointerMs === null
                        ? -1
                        : firstPointerMs,

                first_touch_ms:
                    firstTouchMs === null
                        ? -1
                        : firstTouchMs,

                first_scroll_ms:
                    firstScrollMs === null
                        ? -1
                        : firstScrollMs,

                first_meaningful_ms:
                    firstMeaningfulMs === null
                        ? -1
                        : firstMeaningfulMs,

                max_scroll_pct:
                    maxScrollPct,

                prerendered:
                    wasPrerendered ? 1 : 0,

                final_visibility:
                    document.visibilityState || "unknown",

                final_focus:
                    hasDocumentFocus() ? 1 : 0,

                pagehide_persisted:
                    pagehidePersisted ? 1 : 0
            }
        );
    }


    // -------------------------------------------------
    // Lifecycle
    // -------------------------------------------------

    document.addEventListener(
        "visibilitychange",
        function () {
            visibilityChanges += 1;

            if (isActuallyVisible()) {
                scheduleVisibleTimers();
            } else {
                endVisibleSpan();
                clearTimers();
            }
        }
    );


    if ("prerendering" in document) {
        document.addEventListener(
            "prerenderingchange",
            function () {
                wasPrerendered = true;

                if (isActuallyVisible()) {
                    scheduleVisibleTimers();
                }
            }
        );
    }


    window.addEventListener(
        "pagehide",
        function (event) {
            clearTimers();

            sendMetaExitDiagnostic(
                !!(
                    event &&
                    event.persisted
                )
            );
        }
    );


    // BFCache návrat.
    window.addEventListener(
        "pageshow",
        function () {
            if (isActuallyVisible()) {
                scheduleVisibleTimers();
            }
        }
    );


    // Dokument mohl být visible už při načtení.
    scheduleVisibleTimers();
})();
</script>
{% endif %}
